  <!-- Bottom -->
  <circle cx="256" cy="392" r="35" fill="#60A5FA" opacity="0.85"/>
  <line x1="256" y1="316" x2="256" y2="357" stroke="#ffffff" stroke-width="6" opacity="0.7"/>

